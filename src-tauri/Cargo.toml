[package]
name = "card-do-vendedor"
version = "0.5.0"
description = "Apontamento diário e fechamento mensal do Card do Vendedor"
authors = ["OpenAI"]
edition = "2021"

[lib]
name = "card_do_vendedor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
